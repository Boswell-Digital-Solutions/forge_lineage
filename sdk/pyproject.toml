[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "forge-lineage-sdk"
version = "0.1.0"
description = "Python SDK for ForgeLineage / ImpactGraph. Validates, hashes, and emits lineage records to DataForge Local."
requires-python = ">=3.11"
dependencies = [
    "jsonschema>=4.21",
    "httpx>=0.27"
]

[project.optional-dependencies]
test = ["pytest>=8.0"]

[tool.setuptools.packages.find]
where = ["."]
include = ["forge_lineage_sdk*"]
