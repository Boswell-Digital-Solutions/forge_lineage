name: checks

on:
  pull_request:
  push:
    branches: [main]

jobs:
  unit-and-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e "sdk[test]"
      - run: python -m pytest tests -q -m "not integration"
      - run: CHECK=1 bash doc/system/BUILD.sh
      - run: git diff --check
